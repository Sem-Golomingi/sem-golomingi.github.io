<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration d'un stand de vente de jus de fruits naturels à Kinshasa">
  <title>Vente de jus de fruits naturels</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd083"/>
      <stop offset="1" stop-color="#fff6e6"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98d5f"/>
      <stop offset="1" stop-color="#b07648"/>
    </linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ad6f45"/>
      <stop offset="1" stop-color="#8f5733"/>
    </linearGradient>
    <linearGradient id="juiceOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a23b"/>
      <stop offset="1" stop-color="#ef7f2a"/>
    </linearGradient>
    <linearGradient id="juiceYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d05a"/>
      <stop offset="1" stop-color="#efae2e"/>
    </linearGradient>
    <linearGradient id="juiceRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d75a78"/>
      <stop offset="1" stop-color="#b03a58"/>
    </linearGradient>
    <clipPath id="awningClip">
      <polygon points="95,150 705,150 748,212 52,212"/>
    </clipPath>
    <path id="leaf" d="M0,0 Q9,-16 0,-30 Q-9,-16 0,0 Z" fill="#5aa469"/>
    <path id="leafDark" d="M0,0 Q7,-12 0,-24 Q-7,-12 0,0 Z" fill="#3f8f52"/>
  </defs>

  <!-- Ciel -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Soleil -->
  <circle cx="662" cy="106" r="90" fill="#ffefb0" opacity="0.45"/>
  <circle cx="662" cy="106" r="58" fill="#ffe997"/>

  <!-- Sol -->
  <rect x="0" y="440" width="800" height="60" fill="#f0d9a6"/>
  <rect x="0" y="440" width="800" height="6" fill="#e6c98f"/>

  <!-- Ombre du stand -->
  <ellipse cx="400" cy="446" rx="330" ry="12" fill="#6b4a2a" opacity="0.08"/>

  <!-- Auvent rayé (teal / or, identité du site) -->
  <g clip-path="url(#awningClip)">
    <rect x="40" y="150" width="720" height="70" fill="#e8b95c"/>
    <rect x="52" y="150" width="88" height="70" fill="#1c8298"/>
    <rect x="228" y="150" width="88" height="70" fill="#1c8298"/>
    <rect x="404" y="150" width="88" height="70" fill="#1c8298"/>
    <rect x="580" y="150" width="88" height="70" fill="#1c8298"/>
  </g>
  <polygon points="95,150 705,150 748,212 52,212" fill="none" stroke="#1c8298" stroke-width="5" stroke-linejoin="round"/>
  <rect x="93" y="146" width="614" height="9" rx="4" fill="#ffffff"/>
  <polygon points="52,212 748,212 748,222 52,222" fill="#ffffff"/>

  <!-- Poteaux -->
  <rect x="120" y="212" width="10" height="118" fill="#7c4a2b"/>
  <rect x="670" y="212" width="10" height="118" fill="#7c4a2b"/>

  <!-- Comptoir -->
  <rect x="100" y="330" width="600" height="16" rx="6" fill="url(#wood)"/>
  <rect x="100" y="342" width="600" height="4" fill="#8f5733" opacity="0.35"/>

  <!-- Panneau avant -->
  <rect x="130" y="346" width="540" height="104" rx="4" fill="url(#woodDark)"/>
  <g stroke="#7c4a2b" stroke-width="2" opacity="0.5">
    <line x1="184" y1="346" x2="184" y2="450"/>
    <line x1="238" y1="346" x2="238" y2="450"/>
    <line x1="292" y1="346" x2="292" y2="450"/>
    <line x1="508" y1="346" x2="508" y2="450"/>
    <line x1="562" y1="346" x2="562" y2="450"/>
    <line x1="616" y1="346" x2="616" y2="450"/>
  </g>

  <!-- Enseigne -->
  <rect x="300" y="374" width="200" height="54" rx="10" fill="#ffffff" stroke="#176b87" stroke-width="3"/>
  <g transform="translate(316,393)"><use href="#leaf"/></g>
  <text x="424" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#176b87">JUS NATUREL</text>

  <!-- Verre 1 : jus d'orange -->
  <g>
    <rect x="169" y="252" width="72" height="76" rx="12" fill="#ffffff" opacity="0.45" stroke="#e3d4bd" stroke-width="2"/>
    <rect x="173" y="298" width="64" height="28" rx="8" fill="url(#juiceOrange)"/>
    <rect x="173" y="292" width="64" height="6" rx="3" fill="#ffffff" opacity="0.55"/>
    <rect x="222" y="232" width="8" height="66" rx="4" fill="#e2583f" transform="rotate(12 226 265)"/>
    <circle cx="205" cy="252" r="13" fill="#f7953c"/>
    <circle cx="205" cy="252" r="6" fill="#fff1d0"/>
    <g transform="translate(216,244) rotate(40) scale(0.7)"><use href="#leafDark"/></g>
  </g>

  <!-- Verre 2 : jus d'ananas -->
  <g>
    <rect x="329" y="252" width="72" height="76" rx="12" fill="#ffffff" opacity="0.45" stroke="#e3d4bd" stroke-width="2"/>
    <rect x="333" y="298" width="64" height="28" rx="8" fill="url(#juiceYellow)"/>
    <rect x="333" y="292" width="64" height="6" rx="3" fill="#ffffff" opacity="0.55"/>
    <rect x="382" y="232" width="8" height="66" rx="4" fill="#e2583f" transform="rotate(12 386 265)"/>
    <circle cx="365" cy="252" r="13" fill="#f2c14e"/>
    <circle cx="365" cy="252" r="6" fill="#fff6d6"/>
    <g transform="translate(376,244) rotate(40) scale(0.7)"><use href="#leafDark"/></g>
  </g>

  <!-- Verre 3 : jus de bissap -->
  <g>
    <rect x="489" y="252" width="72" height="76" rx="12" fill="#ffffff" opacity="0.45" stroke="#e3d4bd" stroke-width="2"/>
    <rect x="493" y="298" width="64" height="28" rx="8" fill="url(#juiceRed)"/>
    <rect x="493" y="292" width="64" height="6" rx="3" fill="#ffffff" opacity="0.55"/>
    <rect x="542" y="232" width="8" height="66" rx="4" fill="#e2583f" transform="rotate(12 546 265)"/>
    <circle cx="525" cy="252" r="13" fill="#c94f6d"/>
    <circle cx="525" cy="252" r="6" fill="#fbe0e6"/>
    <g transform="translate(536,244) rotate(40) scale(0.7)"><use href="#leafDark"/></g>
  </g>

  <!-- Fruits à gauche (oranges + mangue) -->
  <g>
    <ellipse cx="108" cy="306" rx="26" ry="18" fill="#ffc93c" transform="rotate(-22 108 306)"/>
    <ellipse cx="100" cy="302" rx="8" ry="5" fill="#ef8f4a" transform="rotate(-22 108 306)"/>
    <circle cx="132" cy="306" r="24" fill="#f7953c"/>
    <circle cx="152" cy="310" r="19" fill="#f9a34a"/>
    <circle cx="132" cy="298" r="4" fill="#fff1d0" opacity="0.7"/>
    <g transform="translate(150,288) rotate(30) scale(0.9)"><use href="#leaf"/></g>
    <g transform="translate(116,282) rotate(-25) scale(0.8)"><use href="#leaf"/></g>
  </g>

  <!-- Bouteille à droite -->
  <g>
    <rect x="610" y="248" width="40" height="82" rx="10" fill="#ffffff" opacity="0.5" stroke="#e3d4bd" stroke-width="2"/>
    <rect x="622" y="230" width="16" height="20" fill="#ffffff" opacity="0.5" stroke="#e3d4bd" stroke-width="2"/>
    <rect x="622" y="224" width="16" height="8" rx="3" fill="#1c8298"/>
    <rect x="616" y="276" width="28" height="36" rx="5" fill="#f6efdf"/>
    <text x="630" y="299" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#b07648">JUS</text>
  </g>

  <!-- Tranche d'orange à droite -->
  <g>
    <circle cx="690" cy="304" r="24" fill="#f7953c"/>
    <circle cx="690" cy="304" r="20" fill="#ffe3b3"/>
    <g stroke="#f7953c" stroke-width="2.5">
      <line x1="690" y1="288" x2="690" y2="320"/>
      <line x1="678" y1="296" x2="702" y2="312"/>
      <line x1="702" y1="296" x2="678" y2="312"/>
    </g>
    <circle cx="690" cy="304" r="4" fill="#f7953c"/>
  </g>

  <!-- Feuilles flottantes -->
  <g opacity="0.9">
    <g transform="translate(72,120) rotate(-20) scale(1.2)"><use href="#leaf"/></g>
    <g transform="translate(120,96) rotate(24) scale(0.9)"><use href="#leafDark"/></g>
    <g transform="translate(728,150) rotate(16) scale(1.1)"><use href="#leaf"/></g>
  </g>

  <!-- Gouttelettes de fraîcheur -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="248" cy="268" r="4"/>
    <circle cx="410" cy="274" r="3.5"/>
    <circle cx="570" cy="266" r="4"/>
  </g>
</svg>
