<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Illustration du site web Project Oree déployé en ligne">
  <title>Project Oree — site web en ligne</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="1" stop-color="#0d1422"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f93b0"/>
      <stop offset="1" stop-color="#176b87"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7bd6d"/>
      <stop offset="1" stop-color="#d6a84f"/>
    </linearGradient>
    <clipPath id="win">
      <rect x="118" y="66" width="564" height="368" rx="18"/>
    </clipPath>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <circle cx="120" cy="110" r="150" fill="#176b87" opacity="0.16"/>
  <circle cx="720" cy="430" r="170" fill="#d6a84f" opacity="0.10"/>

  <!-- Fenêtre navigateur -->
  <g clip-path="url(#win)">
    <rect x="118" y="66" width="564" height="368" fill="#1b2438"/>
    <rect x="118" y="66" width="564" height="42" fill="#243049"/>
    <circle cx="150" cy="87" r="6" fill="#ff5f57"/>
    <circle cx="172" cy="87" r="6" fill="#febc2e"/>
    <circle cx="194" cy="87" r="6" fill="#28c840"/>
    <rect x="232" y="77" width="330" height="20" rx="10" fill="#121c2d"/>
    <circle cx="247" cy="87" r="4" fill="#39d98a"/>
    <text x="258" y="91" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8ea0b8">project-oree.onrender.com</text>

    <!-- mini site -->
    <circle cx="156" cy="140" r="9" fill="url(#goldG)"/>
    <g fill="#41536f">
      <rect x="196" y="136" width="30" height="8" rx="4"/>
      <rect x="236" y="136" width="30" height="8" rx="4"/>
      <rect x="276" y="136" width="30" height="8" rx="4"/>
      <rect x="316" y="136" width="30" height="8" rx="4"/>
    </g>

    <rect x="150" y="184" width="260" height="24" rx="7" fill="#e6ecf5"/>
    <rect x="150" y="216" width="190" height="24" rx="7" fill="#e6ecf5"/>
    <rect x="150" y="252" width="310" height="11" rx="5.5" fill="#5a6b85"/>
    <rect x="150" y="280" width="124" height="38" rx="19" fill="url(#accentG)"/>
    <text x="212" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Découvrir</text>

    <rect x="150" y="344" width="132" height="74" rx="12" fill="#22304a"/>
    <rect x="150" y="344" width="132" height="4" rx="2" fill="url(#goldG)"/>
    <rect x="300" y="344" width="132" height="74" rx="12" fill="#22304a"/>
    <rect x="300" y="344" width="132" height="4" rx="2" fill="url(#accentG)"/>
    <rect x="450" y="344" width="132" height="74" rx="12" fill="#22304a"/>
    <rect x="450" y="344" width="132" height="4" rx="2" fill="url(#goldG)"/>

    <text x="604" y="216" font-family="'Courier New', monospace" font-size="40" font-weight="700" fill="#d6a84f" opacity="0.85">&lt;/&gt;</text>
  </g>
  <rect x="118" y="66" width="564" height="368" rx="18" fill="none" stroke="#2b3a54" stroke-width="2"/>

  <!-- Nuage "déploiement en ligne" -->
  <g>
    <ellipse cx="668" cy="96" rx="52" ry="30" fill="#d6a84f"/>
    <circle cx="632" cy="82" r="22" fill="#d6a84f"/>
    <circle cx="696" cy="72" r="26" fill="#d6a84f"/>
    <path d="M668 60 L650 88 L686 88 Z" fill="#172033"/>
    <rect x="664" y="88" width="8" height="30" rx="4" fill="#172033"/>
  </g>

  <!-- Mot-clé -->
  <text x="150" y="476" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Project <tspan fill="url(#goldG)">Oree</tspan></text>
  <rect x="150" y="486" width="72" height="4" rx="2" fill="url(#accentG)"/>
</svg>
